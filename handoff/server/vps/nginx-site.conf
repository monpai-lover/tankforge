# TankForge behind an existing nginx (manual alternative). Replace @DOMAIN@ and @PORT@, put it in
# nginx's conf.d (http context), then add HTTPS (e.g. certbot --nginx -d @DOMAIN@).
# tg-server serves the page (pre-compressed), /ws (WebSocket) and /rooms.
map $http_upgrade $tankforge_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    location / {
        proxy_pass http://127.0.0.1:@PORT@;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tankforge_connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
